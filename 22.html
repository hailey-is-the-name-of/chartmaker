<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Chart Export Tool</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<!-- html2canvas -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<!-- jsPDF -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
body {
  margin:0;
  font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
  background:#f4f4f2;
}
.wrap {
  max-width:1100px;
  margin:40px auto;
  padding:20px;
}
.card {
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
}
.chartBox { height:560px; }
canvas { width:100%!important; height:100%!important; }

.fixed-btn {
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#111;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
.fixed-btn.alt {
  right:160px;
  background:#fff;
  color:#111;
  border:1px solid #ccc;
}
.editor {
  position:fixed;
  top:80px;
  right:20px;
  width:320px;
  background:#fff;
  border-radius:12px;
  padding:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.15);
  z-index:9999;
}
.editor label { font-size:12px; font-weight:700; display:block; margin-top:10px; }
.editor input, .editor select {
  width:100%;
  padding:6px;
  margin-top:4px;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card" id="captureTarget">
    <h2 id="chartTitle" style="text-align:center;margin:0 0 10px;">
      대구·경북 국정 수행 평가도
    </h2>
    <div class="chartBox">
      <canvas id="chart"></canvas>
    </div>
  </div>
</div>

<button class="fixed-btn alt" onclick="toggleEditor()">설정</button>
<button class="fixed-btn" onclick="exportFlow()">내보내기</button>

<div class="editor" id="editor" style="display:none;">
  <label>출력 프리셋</label>
  <select id="preset">
    <option value="A4">A4 (PDF)</option>
    <option value="INSTAGRAM">인스타</option>
    <option value="TWITTER">트위터</option>
  </select>

  <label>출처 문구</label>
  <input id="footnote" value="출처: 한국갤럽 · 지역: 대구·경북">

  <label>
    <input type="checkbox" id="watermarkToggle"> 워터마크
  </label>
</div>

<script>
/* ================= PRESET ================= */
const PRESETS = {
  A4:{w:2480,h:3508,base:2480},
  INSTAGRAM:{w:1080,h:1080,base:1080},
  TWITTER:{w:1600,h:900,base:1600}
};
const scale = (v,b)=>Math.round(v*(b/2480));

/* ================= CHART ================= */
Chart.register(ChartDataLabels);
const chart = new Chart(document.getElementById("chart"),{
  type:"line",
  data:{
    labels:["10월","11월","12월","1월"],
    datasets:[
      {label:"긍정",data:[57,63,56,51],borderColor:"#3b6cff",borderWidth:3,pointRadius:3},
      {label:"부정",data:[32,25,31,32],borderColor:"#e23b3b",borderWidth:3,pointRadius:3}
    ]
  },
  options:{
    interaction:{mode:null},
    plugins:{
      legend:{display:false},
      tooltip:{enabled:false},
      datalabels:{
        color:"#111",
        font:{weight:"700",size:11},
        formatter:v=>v+"%"
      }
    },
    scales:{
      y:{ticks:{callback:v=>v+"%"}}
    }
  }
});

/* ================= WATERMARK ================= */
const wmImg = new Image();
wmImg.crossOrigin="anonymous";
wmImg.src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAEElEQVR42mP8/5+hHgAHggJ/PtO+1QAAAABJRU5ErkJggg==";

function drawWatermark(ctx,p){
  if(!document.getElementById("watermarkToggle").checked) return;
  const w=scale(420,p.base);
  ctx.globalAlpha=0.08;
  ctx.drawImage(wmImg,(p.w-w)/2,(p.h-w)/2,w,w);
  ctx.globalAlpha=1;
}

/* ================= EXPORT ================= */
async function exportFlow(){
  // tooltip 완전 제거
  chart.setActiveElements([]);
  chart.update("none");

  await new Promise(r=>setTimeout(r,200));

  const preset=PRESETS[preset.value];
  const raw=await html2canvas(captureTarget,{scale:2,backgroundColor:"#fff",useCORS:true});

  const out=document.createElement("canvas");
  out.width=preset.w; out.height=preset.h;
  const ctx=out.getContext("2d");

  ctx.fillStyle="#f7f7f5";
  ctx.fillRect(0,0,out.width,out.height);

  const margin=scale(140,preset.base);
  const titleSize=scale(46,preset.base);
  const footSize=scale(22,preset.base);

  ctx.fillStyle="#111";
  ctx.font=`700 ${titleSize}px sans-serif`;
  ctx.textAlign="center";
  ctx.fillText(chartTitle.innerText,out.width/2,margin);

  const maxW=out.width-margin*2;
  const maxH=out.height-margin*3;
  const ratio=Math.min(maxW/raw.width,maxH/raw.height);
  ctx.drawImage(raw,(out.width-raw.width*ratio)/2,margin*1.6,raw.width*ratio,raw.height*ratio);

  drawWatermark(ctx,preset);

  ctx.font=`${footSize}px sans-serif`;
  ctx.fillStyle="#666";
  ctx.textAlign="left";
  ctx.fillText(footnote.value,margin,out.height-margin);

  const name=`chart_${preset.value}`;
  if(preset.value==="A4"){
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:"px",format:[out.width,out.height]});
    pdf.addImage(out.toDataURL(),"PNG",0,0,out.width,out.height);
    pdf.save(name+".pdf");
  }else{
    const a=document.createElement("a");
    a.href=out.toDataURL("image/png");
    a.download=name+".png";
    a.click();
  }
}

function toggleEditor(){
  editor.style.display = editor.style.display==="none"?"block":"none";
}
</script>

</body>
</html>
