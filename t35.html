<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>정부국정수행평가도 17-18년, 25-26년</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <!-- datalabels plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <!-- ScreenShot Lib -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    .subtitleCenter{
  text-align:center;
  margin: -6px 0 14px;
  font-size: 13px;
  color:#444;
  display:none;
}

    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif; background: #fff; color: #111; }
    .wrap { max-width: 1100px; margin: 32px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 14px; padding: 18px; }
    .chartBox { height: 560px; }
    canvas { width: 100% !important; height: 100% !important; }

    .titleCenter { text-align: center; margin: 0 0 12px; font-size: 18px; font-weight: 700; }

    .legendRow {
      display: flex; flex-wrap: wrap; gap: 10px 14px;
      justify-content: center; align-items: center;
      font-size: 12px; color: #444; margin-bottom: 12px;
    }
    .legendRow .lg { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    .swatch { width: 28px; height: 0; border-top: 3px solid #000; display: inline-block; border-radius: 999px; }

    /* Modal Styles */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 10000;
    }
    .modal-content {
      background: #fff; padding: 0; border-radius: 12px;
      width: 900px; max-width: 95%; height: 80vh;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      font-family: sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      padding: 16px 24px; border-bottom: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
      background: #f9f9f9;
    }
    .modal-title { font-size: 18px; font-weight: bold; }
    .modal-body {
      flex: 1; padding: 24px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 24px;
    }
    .section-title {
      font-size: 16px; font-weight: bold; margin-bottom: 12px;
      border-left: 4px solid #333; padding-left: 8px;
    }
    .control-group { margin-bottom: 12px; }
    .control-group label {display:block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color:#555; }
    .control-group input { width:100%; padding:8px; border:1px solid #ddd; border-radius:4px; box-sizing:border-box; }

    .series-list { border:1px solid #eee; border-radius:6px; overflow:hidden; }
    .series-item {
      display:flex; gap:8px; padding:10px;
      background:#fff; border-bottom:1px solid #eee; align-items:center;
    }
    .series-item:last-child { border-bottom:none; }
    .series-item:nth-child(even) { background:#fafafa; }
    .series-item input[type="text"] { flex:2; padding:6px; border:1px solid #ddd; border-radius:4px; }
    .series-item input[type="color"] { width:40px; height:32px; border:none; padding:0; cursor:pointer; background:none; }
    .series-item select { padding:6px; border:1px solid #ddd; border-radius:4px; }
    .series-item input[type="number"] { width:60px; padding:6px; border:1px solid #ddd; border-radius:4px; }
    .btn-del { background:#fee; color:#d00; border:1px solid #fcc; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px; }
    .btn-add { background:#eff; color:#00a; border:1px solid #cee; padding:8px 16px; border-radius:4px; cursor:pointer; font-weight:bold; margin-top:8px; display:inline-block; }

    .table-container { position:relative; border:1px solid #ccc; border-radius:4px; overflow:auto; max-height:500px; background:#fff; }
    .data-table { width:100%; border-collapse:collapse; font-size:13px; font-family:sans-serif; }
    .data-table th, .data-table td { border:1px solid #ddd; padding:0; min-width:60px; height:32px; }
    .data-table thead th {
      position: sticky; top:0; background:#f4f4f4; z-index:10;
      padding:8px; text-align:center; font-weight:bold; color:#333;
      white-space:normal; word-break:keep-all;
    }
    .data-table input {
      width:100%; height:100%; border:none; outline:none; padding:0 8px;
      box-sizing:border-box; font-family:inherit; background:transparent; text-align:center;
    }
    .data-table input:focus { background:#eef; }

    .modal-footer {
      padding:16px 24px; border-top:1px solid #eee; background:#f9f9f9;
      display:flex; justify-content:flex-end; gap:8px;
    }
    .btn { padding:8px 16px; cursor:pointer; border-radius:6px; border:1px solid #ccc; background:#fff; font-weight:bold; }
    .btn.primary { background:#333; color:#fff; border-color:#333; }
    .helper-text { font-size:12px; color:#666; margin-bottom:4px; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
<h1 class="titleCenter" id="chartTitle">대구·경북 국정 수행 평가도(한국갤럽) 17-18년, 25-26년</h1>
<div class="subtitleCenter" id="chartSubtitle"></div>
      <div class="legendRow" id="legendContainer"></div>
      <div class="chartBox"><canvas id="govChart"></canvas></div>
    </div>
  </div>

  <!-- Editor Modal -->
  <div id="editModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">차트 데이터 및 스타일 수정</div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button id="applyEditorBtnHeader" class="btn primary" style="padding:4px 12px; font-size:13px;">적용</button>
          <button id="closeEditorBtnX" style="border:none; background:none; font-size:20px; cursor:pointer;">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <div>
          <div class="section-title">기본 설정</div>
          <div class="control-group">
            <label>차트 제목</label>
            <input type="text" id="chartTitleInput">
          </div>
          <div class="control-group" style="display:flex; gap:10px; align-items:flex-end;">
  <div style="flex:1;">
    <label>차트 제목 폰트 크기(px)</label>
    <div style="display:flex; gap:6px; align-items:center;">
      <button type="button" class="btn" id="titleFontMinus" style="padding:6px 10px;">-</button>
      <input type="number" id="titleFontSizeInput" min="8" max="80" step="1" value="18">
      <button type="button" class="btn" id="titleFontPlus" style="padding:6px 10px;">+</button>
    </div>
  </div>
</div>
          <div class="control-group" style="margin-top:10px;">
  <label>부제목 (빈칸이면 표시 안 함)</label>
  <input type="text" id="chartSubtitleInput" placeholder="예) 표본/조사기간/출처 설명 등">
</div>

<div class="control-group" style="display:flex; gap:10px; align-items:flex-end;">
  <div style="flex:1;">
    <label>부제목 폰트 크기(px)</label>
    <div style="display:flex; gap:6px; align-items:center;">
      <button type="button" class="btn" id="subFontMinus" style="padding:6px 10px;">-</button>
      <input type="number" id="subtitleFontSizeInput" min="8" max="60" step="1" value="13">
      <button type="button" class="btn" id="subFontPlus" style="padding:6px 10px;">+</button>
    </div>
  </div>
  <div style="flex:1; padding-bottom:2px;">
    <label style="display:inline-flex; align-items:center; cursor:pointer; gap:8px; margin:0;">
      <input type="checkbox" id="subtitleBoldToggle" style="width:auto;">
      부제목 Bold
    </label>
  </div>
</div>
<div class="control-group" style="display:flex; gap:10px; align-items:flex-end; margin-top:10px;">
  <div style="flex:1;">
    <label>X축 폰트 크기(px)</label>
    <div style="display:flex; gap:6px; align-items:center;">
      <button type="button" class="btn" id="xFontMinus" style="padding:6px 10px;">-</button>
      <input type="number" id="xAxisFontSizeInput" min="6" max="40" step="1" value="12">
      <button type="button" class="btn" id="xFontPlus" style="padding:6px 10px;">+</button>
    </div>
  </div>
  <div style="flex:1;">
    <label>Y축 폰트 크기(px)</label>
    <div style="display:flex; gap:6px; align-items:center;">
      <button type="button" class="btn" id="yFontMinus" style="padding:6px 10px;">-</button>
      <input type="number" id="yAxisFontSizeInput" min="6" max="40" step="1" value="12">
      <button type="button" class="btn" id="yFontPlus" style="padding:6px 10px;">+</button>
    </div>
  </div>
</div>

          

          <div class="control-group" style="display:flex; gap:10px;">
            <div style="flex:1;">
              <label>Y축 최소값</label>
              <input type="number" id="yMinInput" placeholder="Auto">
            </div>
            <div style="flex:1;">
              <label>Y축 최대값</label>
              <input type="number" id="yMaxInput" placeholder="Auto">
            </div>
          </div>
          <div class="control-group" style="margin-top:10px;">
            <label style="display:inline-flex; align-items:center; cursor:pointer;">
              <input type="checkbox" id="watermarkToggle" style="width:auto; margin-right:8px;">
              워터마크 표시 (로고)
            </label>
          </div>

          <div class="section-title" style="margin-top:20px;">
            항목(Series) 설정
            <span style="font-size:11px; font-weight:normal; color:#666;">(데이터 열 순서와 일치해야 함)</span>
          </div>
          <div class="series-list" id="seriesList"></div>
          <button class="btn-add" id="addSeriesBtn">+ 항목 추가</button>

          <div style="margin-top:30px;">
            <div class="section-title">데이터 입력</div>
            <div class="helper-text">
              엑셀에서 복사하여 붙여넣으세요.<br>
              첫 열은 <strong>X축(기간)</strong> 이름이어야 하며, 이후 열은 위 항목 순서대로 매칭됩니다.
            </div>

            <!-- ✅ 추가: 데이터 초기화 + 행 추가 버튼 -->
            <div style="display:flex; gap:8px; margin:10px 0 12px; flex-wrap:wrap;">
              <button class="btn" id="resetGridBtn" style="background:#fee; border-color:#fcc; color:#b00;">🧹 데이터 초기화하기</button>
              <button class="btn" id="addRowBtn" style="background:#eef; border-color:#ccd;">➕ 행 추가하기</button>
            </div>

            <div class="table-container">
              <table id="dataTable" class="data-table">
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <div class="modal-footer">
            <div style="margin-right:auto;">
              <button class="btn" id="saveDataBtn" style="background:#eef; border-color:#ccd;">💿 저장</button>
              <button class="btn" id="loadDataBtn" style="background:#eef; border-color:#ccd;">📂 불러오기</button>
              <input type="file" id="loadDataInput" accept=".json" style="display:none;">
            </div>
            <button class="btn" id="closeEditorBtn">닫기</button>
            <button class="btn primary" id="applyEditorBtn">적용하기</button>
          </div>

        </div>
      </div>
    </div>
  </div>

<script>
  // ==============
  // 1) 워터마크
  // ==============
  const watermarkImg = new Image();
  watermarkImg.crossOrigin = "anonymous";
  watermarkImg.src = "150_png_dgsd_logo.png";

  const watermarkPlugin = {
    id: "watermarkPlugin",
    afterDraw(chart, args, pluginOptions) {
      if (!pluginOptions || !pluginOptions.enabled) return;
      const img = pluginOptions.image;
      if (!img || !img.complete || img.naturalWidth === 0) return;

      const { ctx, chartArea } = chart;
      if (!chartArea) return;

      const { left, top, width, height } = chartArea;
      const targetW = pluginOptions.width ?? 300;
      const ratio = img.naturalHeight / img.naturalWidth;
      const targetH = targetW * ratio;

      const x = left + (width - targetW) / 2;
      const y = top + (height - targetH) / 2;

      ctx.save();
      ctx.globalAlpha = pluginOptions.opacity ?? 0.15;
      ctx.drawImage(img, x, y, targetW, targetH);
      ctx.restore();
    }
  };

  // ==============
  // 2) 초기 데이터
  // ==============
  let myChart = null;

  const initLabels = ["10월", "11월", "12월", "1월", "2월"];
  const initDatasets = [
    { label:"긍정평가 17-18년 (문재인 정부)", data:[57,63,56,51,48], borderColor:"#6699ff", borderDash:[8,6], borderWidth:5, pointRadius:4, tension:0.25, _showLabel:true },
    { label:"부정평가 17-18년 (문재인 정부)", data:[32,25,31,32,40], borderColor:"#ff6666", borderDash:[8,6], borderWidth:5, pointRadius:4, tension:0.25, _showLabel:true },
    { label:"긍정평가 25-26년 (이재명 정부)", data:[39.7,44.7,48,44.5], borderColor:"#3c78ff", borderDash:[], borderWidth:5, pointRadius:4, tension:0.25, _showLabel:true },
    { label:"부정평가 25-26년 (이재명 정부)", data:[45.7,42.5,41.5,41], borderColor:"#e63c3c", borderDash:[], borderWidth:5, pointRadius:4, tension:0.25, _showLabel:true }
  ];

  // ==============
  // 3) 유틸
  // ==============
  function getFormattedDate() {
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}${mm}${dd}`;
  }
  function sanitizeFilename(name) {
    return name.replace(/[^a-z0-9가-힣\s_-]/gi, '').trim();
  }
  function saveToLocalStorage(data) {
    try { localStorage.setItem('govChartData', JSON.stringify(data)); }
    catch (e) { console.warn("LocalStorage Save Failed", e); }
  }
  function nextFrame() {
    return new Promise(r => requestAnimationFrame(() => r()));
  }

  // ==============
  // ✅ 3-1) 그리드 유틸: 행 추가 / 초기화
  // ==============
  function addEmptyRowToTable(dataTable) {
    const tbody = dataTable.querySelector('tbody');
    const seriesCount = dataTable.querySelectorAll('thead th').length - 1; // X축 제외
    const tr = document.createElement('tr');

    // X축(기간)
    const tdX = document.createElement('td');
    const inpX = document.createElement('input');
    inpX.type = 'text';
    tdX.appendChild(inpX);
    tr.appendChild(tdX);

    // 시리즈 값들
    for (let i = 0; i < seriesCount; i++) {
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'number';
      td.appendChild(inp);
      tr.appendChild(td);
    }

    tbody.appendChild(tr);
    inpX.focus();
  }

  function resetGridInputs(dataTable) {
    // 입력값 전부 삭제
    dataTable.querySelectorAll('tbody input').forEach(inp => inp.value = '');

    // 행은 1줄만 남김 (빈행 유지)
    const tbody = dataTable.querySelector('tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    if (rows.length > 1) rows.slice(1).forEach(r => r.remove());
  }

  // ==============
  // 4) Legend
  // ==============
  function renderLegend() {
    const container = document.getElementById('legendContainer');
    if (!container || !myChart) return;
    container.innerHTML = '';
    (myChart.data.datasets || []).forEach(ds => {
      const span = document.createElement('span');
      span.className = 'lg';
      const i = document.createElement('i');
      i.className = 'swatch';
      i.style.borderColor = ds.borderColor;
      i.style.borderTopWidth = (ds.borderWidth || 3) + 'px';
      i.style.borderTopStyle = (ds.borderDash && ds.borderDash.length > 0) ? 'dashed' : 'solid';
      span.appendChild(i);
      span.appendChild(document.createTextNode(ds.label));
      container.appendChild(span);
    });
  }

  // ==============
  // 5) Editor helpers
  // ==============
  function renderTable(seriesList, dataTable) {
    const thead = dataTable.querySelector('thead');
    const tbody = dataTable.querySelector('tbody');
    thead.innerHTML = '';
    tbody.innerHTML = '';

    const headTr = document.createElement('tr');
    const thTime = document.createElement('th');
    thTime.innerText = "기간(X축)";
    headTr.appendChild(thTime);

    const seriesInputs = seriesList.querySelectorAll('.series-item input[type="text"]');
    seriesInputs.forEach(inp => {
      const th = document.createElement('th');
      th.innerText = inp.value || "항목";
      headTr.appendChild(th);
    });
    thead.appendChild(headTr);

    const labels = myChart.data.labels || [];
    const datasets = myChart.data.datasets || [];

    for (let i = 0; i < labels.length; i++) {
      const tr = document.createElement('tr');

      const tdTime = document.createElement('td');
      const inpTime = document.createElement('input');
      inpTime.type = 'text';
      inpTime.value = labels[i];
      tdTime.appendChild(inpTime);
      tr.appendChild(tdTime);

      seriesInputs.forEach((_, idx) => {
        const td = document.createElement('td');
        const inp = document.createElement('input');
        inp.type = 'number';
        if (datasets[idx] && datasets[idx].data[i] !== undefined) inp.value = datasets[idx].data[i];
        td.appendChild(inp);
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    }

    // empty row
    addEmptyRowToTable(dataTable);
  }

  function addSeriesRow(seriesList, dataTable, ds) {
    const div = document.createElement('div');
    div.className = 'series-item';

    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.value = (ds.borderColor && ds.borderColor.startsWith('#')) ? ds.borderColor : '#000000';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = ds.label || 'New Series';
    nameInput.placeholder = '항목 이름';
    nameInput.addEventListener('input', () => {
      const idx = Array.from(seriesList.children).indexOf(div);
      const ths = dataTable.querySelectorAll('thead th');
      if (ths[idx + 1]) ths[idx + 1].innerText = nameInput.value;
    });

    const styleSelect = document.createElement('select');
    styleSelect.add(new Option('실선', 'solid'));
    styleSelect.add(new Option('점선', 'dashed'));
    styleSelect.value = (ds.borderDash && ds.borderDash.length > 0) ? 'dashed' : 'solid';

    const widthInput = document.createElement('input');
    widthInput.type = 'number';
    widthInput.value = ds.borderWidth || 5;
    widthInput.min = 1;

    const lblLabel = document.createElement('label');
    lblLabel.innerText = "값(%)";
    lblLabel.style.width = "auto";
    lblLabel.style.fontSize = "12px";
    lblLabel.style.marginLeft = "5px";

    const chkLabel = document.createElement('input');
    chkLabel.type = 'checkbox';
    chkLabel.className = 'chk-show-label';
    chkLabel.checked = (ds._showLabel !== false);
    lblLabel.prepend(chkLabel);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn-del';
    delBtn.innerText = '삭제';
    delBtn.onclick = () => {
      div.remove();
      renderTable(seriesList, dataTable);
    };

    div.appendChild(colorInput);
    div.appendChild(nameInput);
    div.appendChild(styleSelect);
    div.appendChild(widthInput);
    div.appendChild(lblLabel);
    div.appendChild(delBtn);

    seriesList.appendChild(div);
  }

  function loadChartFromData(savedData, uiRefs) {
    const { titleInput, yMinInput, yMaxInput, seriesList, dataTable, watermarkToggle } = uiRefs;

    if (savedData.title) {
      document.getElementById('chartTitle').innerText = savedData.title;
      titleInput.value = savedData.title;
    }

    if (savedData.yMin !== undefined) { myChart.options.scales.y.min = savedData.yMin; yMinInput.value = savedData.yMin; }
    else { delete myChart.options.scales.y.min; yMinInput.value = ""; }

    if (savedData.yMax !== undefined) { myChart.options.scales.y.max = savedData.yMax; yMaxInput.value = savedData.yMax; }
    else { delete myChart.options.scales.y.max; yMaxInput.value = ""; }

    if (savedData.showWatermark !== undefined) {
      watermarkToggle.checked = savedData.showWatermark;
      if (myChart.options.plugins.watermarkPlugin) myChart.options.plugins.watermarkPlugin.enabled = savedData.showWatermark;
    }
// 제목 폰트 크기
if (savedData.titleFontSize !== undefined) {
  const t = parseInt(savedData.titleFontSize, 10);
  document.getElementById('chartTitle').style.fontSize = (Number.isFinite(t) ? t : 18) + "px";
  uiRefs.titleFontSizeInput.value = Number.isFinite(t) ? t : 18;
}

// 부제목
const subEl = document.getElementById('chartSubtitle');
const subText = (savedData.subtitle || "").trim();
uiRefs.chartSubtitleInput.value = subText;

if (!subText) {
  subEl.textContent = "";
  subEl.style.display = "none";
} else {
  subEl.textContent = subText;
  subEl.style.display = "block";
}

if (savedData.subtitleFontSize !== undefined) {
  const s = parseInt(savedData.subtitleFontSize, 10);
  subEl.style.fontSize = (Number.isFinite(s) ? s : 13) + "px";
  uiRefs.subtitleFontSizeInput.value = Number.isFinite(s) ? s : 13;
}

if (savedData.subtitleBold !== undefined) {
  subEl.style.fontWeight = savedData.subtitleBold ? "700" : "400";
  uiRefs.subtitleBoldToggle.checked = !!savedData.subtitleBold;
}

// 축 폰트
if (savedData.xAxisFontSize !== undefined) {
  const x = parseInt(savedData.xAxisFontSize, 10);
  myChart.options.scales.x.ticks.font = myChart.options.scales.x.ticks.font || {};
  if (Number.isFinite(x)) myChart.options.scales.x.ticks.font.size = x;
  uiRefs.xAxisFontSizeInput.value = Number.isFinite(x) ? x : 12;
}
if (savedData.yAxisFontSize !== undefined) {
  const y = parseInt(savedData.yAxisFontSize, 10);

  async function captureCardPng() {
    const target = document.querySelector('.card');
    if (!target) throw new Error("Target element (.card) not found.");

    const SCALE_FACTOR = 3;
    const MARGIN = 50;

    const dateStr = getFormattedDate();
    const d = new Date();
    const timeStr = String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    const title = document.getElementById('chartTitle').innerText;
    const safeTitle = sanitizeFilename(title) || "Chart";
    const defaultName = `${safeTitle}_${dateStr}_${timeStr}.png`;

    let filename = prompt("이미지 파일 이름을 입력하세요:", defaultName);
    if (!filename) return;
    if (!filename.endsWith('.png')) filename += '.png';

    const originalDPR = myChart.options.devicePixelRatio || 1;
    myChart.options.devicePixelRatio = SCALE_FACTOR;

    const prevTooltipEnabled = myChart.options.plugins.tooltip.enabled;
    myChart.options.plugins.tooltip.enabled = false;

    myChart.setActiveElements([]);
    if (myChart.tooltip) myChart.tooltip.setActiveElements([], { x: 0, y: 0 });

    myChart.resize();
    myChart.update('none');

    await nextFrame();
    await nextFrame();

    const canvas = await html2canvas(target, {
      scale: SCALE_FACTOR,
      backgroundColor: '#ffffff',
      logging: false,
      useCORS: true
    });

    myChart.options.plugins.tooltip.enabled = prevTooltipEnabled;
    myChart.options.devicePixelRatio = originalDPR;
    myChart.resize();
    myChart.update('none');

    const finalCanvas = document.createElement('canvas');
    const m = MARGIN * SCALE_FACTOR;
    finalCanvas.width = canvas.width + (m * 2);
    finalCanvas.height = canvas.height + (m * 2);

    const ctx2 = finalCanvas.getContext('2d');
    ctx2.fillStyle = '#ffffff';
    ctx2.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
    ctx2.drawImage(canvas, m, m);

    const a = document.createElement('a');
    a.download = filename;
    a.href = finalCanvas.toDataURL("image/png");
    a.click();
  }

function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
function nval(el, fallback) {
  const v = parseInt(el.value, 10);
  return Number.isFinite(v) ? v : fallback;
}
function bump(el, delta, min, max) {
  const v = nval(el, min);
  el.value = clamp(v + delta, min, max);
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}

          startRowIdx = tableRows.indexOf(tr);
